<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园点餐 — 监管方工作台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.6.1/dist/index.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; }
    .app { min-height: 100vh; }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); }
    .login-box { background: #fff; border-radius: 16px; padding: 40px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
    .login-box h2 { margin-bottom: 8px; font-size: 22px; color: #1a365d; }
    .login-box p { color: #999; margin-bottom: 24px; font-size: 14px; }
    .main-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #1a365d; color: #fff; padding: 20px 0; position: fixed; top: 0; left: 0; bottom: 0; }
    .sidebar h3 { text-align: center; margin-bottom: 24px; font-size: 16px; padding: 0 16px; }
    .sidebar .user { text-align: center; padding: 12px 16px; border-bottom: 1px solid #2d4a6e; margin-bottom: 12px; font-size: 13px; color: #b0c4de; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 20px; cursor: pointer; transition: 0.2s; font-size: 14px; color: #b0c4de; }
    .nav-item:hover, .nav-item.active { background: #2d4a6e; color: #fff; }
    .content { flex: 1; margin-left: 220px; padding: 20px 24px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-bar h2 { font-size: 20px; color: #1a365d; }
    .logout-btn { background: none; border: 1px solid #e74c3c; color: #e74c3c; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .logout-btn:hover { background: #e74c3c; color: #fff; }
    .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-card .label { font-size: 13px; color: #999; margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: #1a365d; }
    .panel { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
    .panel h3 { font-size: 16px; margin-bottom: 16px; color: #1a365d; border-bottom: 2px solid #1a365d; padding-bottom: 8px; display: inline-block; }
    .eval-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .eval-form .full-row { grid-column: 1 / -1; }
    .ranking-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .ranking-item:last-child { border: none; }
    .rank-num { width: 32px; height: 32px; border-radius: 50%; background: #e8e8e8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; margin-right: 12px; }
    .rank-num.top { background: linear-gradient(135deg, #f59e0b, #e67e22); color: #fff; }
    .rank-info { flex: 1; }
    .rank-name { font-weight: 600; font-size: 15px; }
    .rank-meta { font-size: 12px; color: #999; }
    .score-badge { background: #ecfdf5; color: #10b981; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: 600; }
    .score-badge.low { background: #fef3c7; color: #f59e0b; }
    .table-wrap { width: 100%; }
    .table-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table-wrap th { background: #f8fafc; padding: 10px 12px; text-align: left; font-weight: 600; color: #666; border-bottom: 2px solid #e8e8e8; }
    .table-wrap td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .tag-green { background: #ecfdf5; color: #10b981; }
    .tag-blue { background: #eff6ff; color: #3b82f6; }
    .tag-yellow { background: #fefce8; color: #ca8a04; }
    .tag-red { background: #fef2f2; color: #ef4444; }
  </style>
</head>
<body>
<div id="app">
  <!-- Login Screen -->
  <div v-if="!loggedIn" class="login-wrap">
    <div class="login-box">
      <div style="font-size:40px;margin-bottom:12px;">🛡️</div>
      <h2>平台监管方工作台</h2>
      <p>校园点餐系统·管理后台</p>
      <input v-model="loginForm.username" placeholder="账号：admin" style="display:block;width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:12px;font-size:14px;box-sizing:border-box" />
      <input v-model="loginForm.password" type="password" placeholder="密码：admin123" style="display:block;width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:16px;font-size:14px;box-sizing:border-box" @keyup.enter="doLogin" />
      <button type="button" style="width:100%;height:44px;background:#1a365d;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer" @click="doLogin" :disabled="loggingIn">
        {{ loggingIn ? '登录中...' : '登 录' }}
      </button>
      <div style="margin-top:12px;color:#999;font-size:12px">测试账号：admin / admin123</div>
      <div v-if="loginError" style="margin-top:8px;color:#e74c3c;font-size:13px">{{ loginError }}</div>
    </div>
  </div>

  <!-- Main App -->
  <div v-else class="main-layout">
    <aside class="sidebar">
      <h3>🛡️ 监管方工作台</h3>
      <div class="user">👤 {{ supervisorInfo.name }}</div>
      <div class="nav-item" :class="{ active: tab === 'dashboard' }" @click="tab = 'dashboard'">📊 工作台</div>
      <div class="nav-item" :class="{ active: tab === 'shops' }" @click="tab = 'shops'">🏪 商家管理</div>
      <div class="nav-item" :class="{ active: tab === 'evaluations' }" @click="tab = 'evaluations'">📝 考评记录</div>
      <div class="nav-item" :class="{ active: tab === 'registrations' }" @click="tab = 'registrations'">📋 注册审核
        <span v-if="pendingRegCount > 0" style="background:#e74c3c;color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:4px">{{ pendingRegCount }}</span>
      </div>
      <div class="nav-item" :class="{ active: tab === 'rewards' }" @click="tab = 'rewards'">🏆 平台奖励</div>
    </aside>
    <main class="content">
      <div class="top-bar">
        <h2>{{ tabTitle }}</h2>
        <button class="logout-btn" @click="doLogout">退出登录</button>
      </div>

      <!-- Dashboard -->
      <template v-if="tab === 'dashboard'">
        <div class="card-grid">
          <div class="stat-card"><div class="label">平台商家</div><div class="value">{{ dashboard.shopCount }}</div></div>
          <div class="stat-card"><div class="label">今日订单</div><div class="value">{{ dashboard.todayOrders }}</div></div>
          <div class="stat-card"><div class="label">考评记录</div><div class="value">{{ dashboard.totalEvaluations }}</div></div>
          <div class="stat-card"><div class="label">平台奖励</div><div class="value">{{ dashboard.totalRewards }}</div></div>
        </div>
        <div class="panel">
          <h3>🏆 商家综合排名</h3>
          <div class="ranking-item" v-for="(s, i) in dashboard.shopRankings" :key="s.id">
            <div class="rank-num" :class="{ top: i < 3 }">{{ i + 1 }}</div>
            <div class="rank-info">
              <div class="rank-name">{{ s.name }}</div>
              <div class="rank-meta">月销量 {{ s.monthlySales }} · {{ s.status === 'open' ? '营业中' : '休息中' }}</div>
            </div>
            <div class="score-badge" :class="{ low: s.score < 50 }">{{ s.score }} 分</div>
          </div>
          <div v-if="!dashboard.shopRankings?.length" style="color:#999;text-align:center;padding:20px">暂无商家数据</div>
        </div>
      </template>

      <!-- Shops List -->
      <template v-if="tab === 'shops'">
        <div class="panel">
          <h3>🏪 商家列表</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>商家名称</th><th>评分</th><th>月销量</th><th>考评次数</th><th>奖励次数</th><th>完成订单</th><th>学生评分</th><th>操作</th></tr></thead>
              <tbody>
                <tr v-for="shop in shops" :key="shop.id">
                  <td><strong>{{ shop.name }}</strong></td>
                  <td><span :class="'score-badge' + (shop.score < 50 ? ' low' : '')">{{ shop.score || 0 }}</span></td>
                  <td>{{ shop.monthlySales || 0 }}</td>
                  <td>{{ shop.evaluationCount }}</td>
                  <td>{{ shop.rewardCount }}</td>
                  <td>{{ shop.completedOrders }}</td>
                  <td>{{ shop.averageRating }} ⭐</td>
                  <td>
                    <el-button size="small" type="primary" @click="openEvaluationModal(shop)">考评</el-button>
                    <el-button size="small" type="success" @click="openRewardModal(shop)">奖励</el-button>
                  </td>
                </tr>
                <tr v-if="!shops.length"><td colspan="8" style="text-align:center;color:#999;padding:20px">暂无商家</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- Evaluations -->
      <template v-if="tab === 'evaluations'">
        <div class="panel">
          <h3>📝 考评记录</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>商家</th><th>类型</th><th>得分</th><th>内容</th><th>时间</th><th>操作</th></tr></thead>
              <tbody>
                <tr v-for="e in evaluations" :key="e.id">
                  <td>{{ e.shopName }}</td>
                  <td><span :class="'tag tag-' + typeColor(e.type)">{{ typeLabel(e.type) }}</span></td>
                  <td><strong>{{ e.score }}</strong></td>
                  <td>{{ e.content }}</td>
                  <td>{{ fmtTime(e.createTime) }}</td>
                  <td><el-button size="small" type="danger" @click="deleteEvaluation(e.id)">删除</el-button></td>
                </tr>
                <tr v-if="!evaluations.length"><td colspan="6" style="text-align:center;color:#999;padding:20px">暂无考评记录</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- Registrations -->
      <template v-if="tab === 'registrations'">
        <div class="panel">
          <h3>📋 商家注册审核</h3>
          <div style="display:flex;gap:8px;margin-bottom:16px">
            <button v-for="s in ['pending','approved','rejected']" :key="s"
              style="padding:6px 16px;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:13px"
              :style="regFilter === s ? 'background:#1a365d;color:#fff;border-color:#1a365d' : 'background:#fff;color:#666'"
              @click="regFilter = s">
              {{ {pending:'待审核',approved:'已批准',rejected:'已驳回'}[s] }}
            </button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>店铺名称</th><th>电话</th><th>地址</th><th>营业时间</th><th>状态</th><th>申请时间</th><th>操作</th></tr></thead>
              <tbody>
                <tr v-for="r in filteredRegistrations" :key="r.id">
                  <td><strong>{{ r.shopName }}</strong></td>
                  <td>{{ r.phone }}</td>
                  <td>{{ r.address }}</td>
                  <td>{{ r.businessHours }}</td>
                  <td><span :class="'tag tag-' + (r.status === 'pending' ? 'yellow' : r.status === 'approved' ? 'green' : 'red')">{{ {pending:'待审核',approved:'已批准',rejected:'已驳回'}[r.status] }}</span></td>
                  <td>{{ fmtTime(r.createTime) }}</td>
                  <td v-if="r.status === 'pending'">
                    <el-button size="small" type="primary" @click="approveRegistration(r)">批准</el-button>
                    <el-button size="small" type="danger" @click="openRejectModal(r)">驳回</el-button>
                  </td>
                  <td v-else>—</td>
                </tr>
                <tr v-if="!filteredRegistrations.length"><td colspan="7" style="text-align:center;color:#999;padding:20px">暂无注册申请</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- Rewards -->
      <template v-if="tab === 'rewards'">
        <div class="panel">
          <h3>🏆 平台奖励记录</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>商家</th><th>标题</th><th>内容</th><th>奖励价值 (¥)</th><th>时间</th></tr></thead>
              <tbody>
                <tr v-for="r in rewards" :key="r.id">
                  <td>{{ r.shopName }}</td>
                  <td><strong>{{ r.title }}</strong></td>
                  <td>{{ r.content }}</td>
                  <td>¥{{ r.value || 0 }}</td>
                  <td>{{ fmtTime(r.createTime) }}</td>
                </tr>
                <tr v-if="!rewards.length"><td colspan="5" style="text-align:center;color:#999;padding:20px">暂无奖励记录</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </template>
    </main>
  </div>

  <!-- Evaluation Modal -->
  <el-dialog v-model="showEvalModal" title="创建商家考评" width="500px">
    <el-form label-width="80px">
      <el-form-item label="商家"><strong>{{ selectedShop?.name }}</strong></el-form-item>
      <el-form-item label="考评类型">
        <el-select v-model="evalForm.type" placeholder="选择类型">
          <el-option label="菜品质量" value="quality" />
          <el-option label="服务态度" value="service" />
          <el-option label="卫生状况" value="hygiene" />
          <el-option label="出餐速度" value="speed" />
        </el-select>
      </el-form-item>
      <el-form-item label="得分">
        <el-input-number v-model="evalForm.score" :min="0" :max="100" />
        <span style="margin-left:8px;color:#999;font-size:12px">0-100 分</span>
      </el-form-item>
      <el-form-item label="评语">
        <el-input v-model="evalForm.content" type="textarea" rows="3" placeholder="填写考评说明" />
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="showEvalModal = false">取消</el-button>
      <el-button type="primary" @click="submitEvaluation" :loading="submitting">提交考评</el-button>
    </template>
  </el-dialog>

  <!-- Reject Registration Modal -->
  <el-dialog v-model="showRejectModal" title="驳回注册申请" width="450px">
    <el-form label-width="80px">
      <el-form-item label="店铺"><strong>{{ selectedRegistration?.shopName }}</strong></el-form-item>
      <el-form-item label="驳回原因">
        <el-input v-model="rejectReason" type="textarea" rows="3" placeholder="请填写驳回原因" />
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="showRejectModal = false">取消</el-button>
      <el-button type="danger" @click="confirmReject" :loading="submitting">确认驳回</el-button>
    </template>
  </el-dialog>

  <!-- Reward Modal -->
  <el-dialog v-model="showRewardModal" title="发放平台奖励" width="500px">
    <el-form label-width="80px">
      <el-form-item label="商家"><strong>{{ selectedShop?.name }}</strong></el-form-item>
      <el-form-item label="奖励标题">
        <el-input v-model="rewardForm.title" placeholder="如：月度优秀商家" />
      </el-form-item>
      <el-form-item label="奖励内容">
        <el-input v-model="rewardForm.content" type="textarea" rows="2" placeholder="奖励说明" />
      </el-form-item>
      <el-form-item label="奖励价值 (¥)">
        <el-input-number v-model="rewardForm.value" :min="0" :step="100" />
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="showRewardModal = false">取消</el-button>
      <el-button type="primary" @click="submitReward" :loading="submitting">确认发放</el-button>
    </template>
  </el-dialog>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.6.1/dist/index.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
const { createApp, ref, computed, onMounted } = Vue

createApp({
  setup() {
    const BASE = location.origin + '/api/supervisor'
    const api = {
      login: (d) => axios.post(BASE + '/login', d),
      dashboard: () => axios.get(BASE + '/dashboard'),
      shops: () => axios.get(BASE + '/shops'),
      evaluations: (p) => axios.get(BASE + '/evaluations', { params: p }),
      createEvaluation: (d) => axios.post(BASE + '/evaluations', d),
      deleteEvaluation: (id) => axios.delete(BASE + '/evaluations/' + id),
      rewards: (p) => axios.get(BASE + '/rewards', { params: p }),
      createReward: (d) => axios.post(BASE + '/rewards', d)
    }

    const loggedIn = ref(false)
    const loggingIn = ref(false)
    const submitting = ref(false)
    const loginError = ref('')
    const supervisorInfo = ref(null)
    const loginForm = ref({ username: 'admin', password: 'admin123' })
    const tab = ref('dashboard')
    const dashboard = ref({})
    const shops = ref([])
    const evaluations = ref([])
    const rewards = ref([])
    const registrations = ref([])
    const regFilter = ref('pending')
    const showEvalModal = ref(false)
    const showRewardModal = ref(false)
    const showRejectModal = ref(false)
    const selectedShop = ref(null)
    const selectedRegistration = ref(null)
    const rejectReason = ref('')
    const evalForm = ref({ type: 'quality', score: 80, content: '' })
    const rewardForm = ref({ title: '', content: '', value: 0 })

    const pendingRegCount = computed(() => registrations.value.filter(r => r.status === 'pending').length)
    const filteredRegistrations = computed(() => registrations.value.filter(r => r.status === regFilter.value))
    const tabTitle = computed(() => ({
      dashboard: '工作台', shops: '商家管理', evaluations: '考评记录', registrations: '注册审核', rewards: '平台奖励'
    }[tab.value]))

    async function doLogin() {
      loginError.value = ''
      if (!loginForm.value.username || !loginForm.value.password) {
        loginError.value = '请输入账号和密码'
        return
      }
      loggingIn.value = true
      try {
        const res = await api.login(loginForm.value)
        if (res.data.code === 0) {
          supervisorInfo.value = res.data.data.supervisorInfo
          loggedIn.value = true
          localStorage.setItem('supervisor_token', res.data.data.token)
          loadAll()
        } else {
          loginError.value = res.data.message || '登录失败'
        }
      } catch { loginError.value = '网络错误，请确认 Express 服务器已启动 (localhost:3000)' }
      finally { loggingIn.value = false }
    }

    function doLogout() {
      loggedIn.value = false
      supervisorInfo.value = null
      localStorage.removeItem('supervisor_token')
    }

    async function loadAll() {
      try {
        const [d, s, e, rw, rg] = await Promise.all([
          api.dashboard(), api.shops(), api.evaluations(), api.rewards(),
          axios.get(BASE + '/registrations')
        ])
        if (d.data.code === 0) dashboard.value = d.data.data
        if (s.data.code === 0) shops.value = s.data.data
        if (e.data.code === 0) evaluations.value = e.data.data
        if (rw.data.code === 0) rewards.value = rw.data.data
        if (rg.data.code === 0) registrations.value = rg.data.data
      } catch { /* silent */ }
    }

    async function approveRegistration(reg) {
      try {
        await ElementPlus.ElMessageBox.confirm(`确定批准"${reg.shopName}"的注册申请吗？批准后将自动创建商家账号（密码：123456）。`, '确认批准', { type: 'info' })
        const res = await axios.put(BASE + '/registrations/' + reg.id + '/approve')
        if (res.data.code === 0) { ElementPlus.ElMessage.success(res.data.data.message + ' | 商家账号：' + res.data.data.shopId + ' | 密码：' + res.data.data.password); loadAll() }
        else { ElementPlus.ElMessage.error(res.data.message) }
      } catch { /* cancelled */ }
    }

    function openRejectModal(reg) { selectedRegistration.value = reg; rejectReason.value = ''; showRejectModal.value = true }

    async function confirmReject() {
      if (!rejectReason.value) { ElementPlus.ElMessage.warning('请填写驳回原因'); return }
      submitting.value = true
      try {
        const res = await axios.put(BASE + '/registrations/' + selectedRegistration.value.id + '/reject', { reason: rejectReason.value })
        if (res.data.code === 0) { ElementPlus.ElMessage.success('已驳回'); showRejectModal.value = false; loadAll() }
        else { ElementPlus.ElMessage.error(res.data.message) }
      } catch { ElementPlus.ElMessage.error('操作失败') }
      finally { submitting.value = false }
    }

    function openEvaluationModal(shop) {
      selectedShop.value = shop
      evalForm.value = { type: 'quality', score: 80, content: '' }
      showEvalModal.value = true
    }

    function openRewardModal(shop) {
      selectedShop.value = shop
      rewardForm.value = { title: '', content: '', value: 0 }
      showRewardModal.value = true
    }

    async function submitEvaluation() {
      submitting.value = true
      try {
        const res = await api.createEvaluation({ shopId: selectedShop.value.id, ...evalForm.value })
        if (res.data.code === 0) {
          ElementPlus.ElMessage.success('考评已提交')
          showEvalModal.value = false
          loadAll()
        } else { ElementPlus.ElMessage.error(res.data.message) }
      } catch { ElementPlus.ElMessage.error('提交失败') }
      finally { submitting.value = false }
    }

    async function deleteEvaluation(id) {
      try {
        await ElementPlus.ElMessageBox.confirm('确定删除该考评记录吗？', '提示', { type: 'warning' })
        await api.deleteEvaluation(id)
        ElementPlus.ElMessage.success('已删除')
        loadAll()
      } catch { /* cancelled */ }
    }

    async function submitReward() {
      if (!rewardForm.value.title) { ElementPlus.ElMessage.warning('请填写奖励标题'); return }
      submitting.value = true
      try {
        const res = await api.createReward({ shopId: selectedShop.value.id, ...rewardForm.value })
        if (res.data.code === 0) {
          ElementPlus.ElMessage.success('奖励已发放')
          showRewardModal.value = false
          loadAll()
        } else { ElementPlus.ElMessage.error(res.data.message) }
      } catch { ElementPlus.ElMessage.error('提交失败') }
      finally { submitting.value = false }
    }

    function fmtTime(ts) { return ts ? new Date(ts).toLocaleString('zh-CN') : '' }
    function typeLabel(t) { return { quality: '菜品质量', service: '服务态度', hygiene: '卫生状况', speed: '出餐速度' }[t] || t }
    function typeColor(t) { return { quality: 'blue', service: 'green', hygiene: 'yellow', speed: 'red' }[t] || '' }

    onMounted(() => {
      const token = localStorage.getItem('supervisor_token')
      if (token) {
        // Try to auto-restore session
        supervisorInfo.value = { id: 'admin', name: '平台管理员' }
        loggedIn.value = true
        loadAll()
      }
    })

    return {
      loggedIn, loggingIn, submitting, supervisorInfo, loginForm, loginError, tab, tabTitle,
      dashboard, shops, evaluations, rewards, registrations, regFilter, pendingRegCount, filteredRegistrations,
      showEvalModal, showRewardModal, showRejectModal, selectedShop, selectedRegistration, rejectReason, evalForm, rewardForm,
      doLogin, doLogout, openEvaluationModal, openRewardModal, approveRegistration, openRejectModal, confirmReject,
      submitEvaluation, deleteEvaluation, submitReward,
      fmtTime, typeLabel, typeColor
    }
  }
}).use(ElementPlus).mount('#app')
</script>
</body>
</html>
