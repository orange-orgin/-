# .vscode/preview.yml
# 校园点餐系统：点击「运行」后同时打开商家端与监管端
autoOpen: true # 打开工作空间时是否自动开启所有应用的预览
apps:
  # 商家端管理后台（这个进程同时也会在 3001 上暴露监管端入口）
  - port: 3000 # 应用的端口
    run: node server.js # 应用的启动命令
    root: ./server # 应用的启动目录
    name: '商家端管理后台' # 应用名称
    description: 校园点餐 - 商家端管理后台 # 应用描述
    autoOpen: true # 是否自动开启该应用的预览
    autoPreview: true
    mainPort: true # 主预览端口

  # 监管端：服务已由上面那条命令在 3001 上启动，这里只做占位，让预览自动打开
  - port: 3001 # 应用的端口
    run: sh -c 'sleep 5 && tail -f /dev/null' # 等 3001 就绪后常驻
    root: ./server # 应用的启动目录
    name: '监管端' # 应用名称
    description: 校园点餐 - 平台监管端 # 应用描述
    autoOpen: true
    autoPreview: true